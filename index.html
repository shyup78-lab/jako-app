<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24476B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일한통역">
<title>일한 실시간 통역</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18222F; --muted:#6A7684; --line:#D7DDE3;
  --ai:#24476B; --ai-soft:#DCE6F0; --live:#B8432F; --ko-size:1.45rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121821; --panel:#1A222D; --ink:#E6EBF0; --muted:#8C98A6; --line:#2B3542;
    --ai:#8FB4DA; --ai-soft:#22303F; --live:#E27A64; }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:.6rem;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.05rem;font-weight:700;margin:0}
h1 span{color:var(--ai)}
#status{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
#status .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
#status.on .dot{background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#status.on .dot{animation:none}}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:.4rem .75rem;font:inherit;font-size:.85rem;cursor:pointer}
main{flex:1;overflow-y:auto;padding:1.2rem 1.1rem 2rem}
.wrap{max-width:46rem;margin:0 auto}
.empty{color:var(--muted);line-height:1.7;padding:2rem 0}
.empty strong{color:var(--ink)}
.seg{padding:.9rem 0 1rem;border-bottom:1px solid var(--line)}
.ja{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:var(--muted);font-size:.95rem;line-height:1.6;margin:0 0 .3rem}
.ko{font-size:var(--ko-size);font-weight:600;line-height:1.5;margin:0;white-space:pre-wrap}
.ko.pending{color:var(--muted);font-weight:400;font-size:1rem}
.ko.err{color:var(--live);font-weight:400;font-size:.95rem}
.interim{padding:.9rem 0}
.interim .ja{color:var(--live)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:.75rem 1.1rem}
.dock{max-width:46rem;margin:0 auto;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
#mic{border:0;border-radius:999px;padding:.8rem 1.3rem;font:inherit;font-weight:700;background:var(--ai);color:var(--panel);cursor:pointer;display:flex;align-items:center;gap:.5rem}
#mic.on{background:var(--live)}
#mic svg{width:1.1rem;height:1.1rem}
#mic:disabled{opacity:.45;cursor:not-allowed}
form.inline{flex:1 1 16rem;display:flex;gap:.4rem;min-width:0}
#txt{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:.7rem 1rem;font:inherit;background:var(--bg);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:.6rem .9rem;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ai);color:var(--panel);border-color:var(--ai)}
.tools{display:flex;gap:.4rem;margin-left:auto}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
#note{max-width:46rem;margin:.5rem auto 0;font-size:.82rem;color:var(--muted);min-height:1em}
#note.warn{color:var(--live)}
@media (max-width:560px){.tools{margin-left:0;width:100%;justify-content:flex-end}:root{--ko-size:1.3rem}}
/* settings */
dialog{border:0;border-radius:14px;padding:0;max-width:30rem;width:calc(100% - 2rem);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,22,.5)}
.dlg{padding:1.2rem 1.3rem}
.dlg h2{font-size:1.1rem;margin:0 0 1rem}
.dlg label{display:block;font-size:.88rem;font-weight:600;margin:1rem 0 .35rem}
.dlg .hint{font-size:.8rem;color:var(--muted);margin:.35rem 0 0;line-height:1.55}
.dlg input,.dlg select,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.dlg textarea{min-height:5rem;resize:vertical}
.dlg .row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.3rem}
</style>
</head>
<body>
<header>
  <h1>日本語 <span>→ 한국어</span></h1>
  <div id="status"><span class="dot"></span><span id="statusText">대기 중</span></div>
  <button class="iconbtn" id="openSettings" type="button">설정</button>
</header>

<main id="scroller">
  <div class="wrap" id="log">
    <div class="empty" id="empty">
      <strong>마이크 켜기</strong>를 누르고 일본어로 말하면, 문장이 끝날 때마다 한국어 번역이 여기에 쌓여요.<br>
      처음이라면 오른쪽 위 <strong>설정</strong>에서 번역 방식을 먼저 골라 주세요.
    </div>
  </div>
  <div class="wrap interim" id="interim" hidden><p class="ja" id="interimText"></p></div>
</main>

<footer>
  <div class="dock">
    <button id="mic" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="micLabel">마이크 켜기</span>
    </button>
    <form class="inline" id="form">
      <input id="txt" type="text" placeholder="일본어 입력 또는 붙여넣기" autocomplete="off" aria-label="일본어 문장">
      <button class="btn" type="submit">번역</button>
    </form>
    <div class="tools">
      <button class="btn" id="size" type="button">가+</button>
      <button class="btn" id="copy" type="button">전체 복사</button>
      <button class="btn" id="clear" type="button">지우기</button>
    </div>
  </div>
  <div id="note" role="status"></div>
</footer>

<dialog id="settings">
  <form method="dialog" class="dlg" id="settingsForm">
    <h2>설정</h2>
    <label for="engine">번역 방식</label>
    <select id="engine">
      <option value="claude">Claude API (정확도 높음, API 키 필요)</option>
      <option value="chrome">Chrome 내장 번역 (무료, PC Chrome 전용)</option>
    </select>
    <p class="hint" id="engineHint"></p>

    <div id="claudeFields">
      <label for="apiKey">Anthropic API 키</label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      <p class="hint">키는 이 기기의 브라우저에만 저장되고, 번역 요청 때 Anthropic 서버로만 전송돼요. console.anthropic.com에서 발급하고 월 사용 한도를 걸어두는 걸 권해요.</p>
    </div>

    <label for="ctx">상황·용어 메모 (선택, Claude 방식에서 사용)</label>
    <textarea id="ctx" placeholder="예: 본사 환경안전 담당자와의 회의. 石井会長 = 이시이 회장, 排出量 = 배출량"></textarea>

    <div class="row">
      <button class="btn" value="cancel" type="submit">닫기</button>
      <button class="btn primary" id="saveSettings" value="save" type="submit">저장</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = $("log"), empty = $("empty"), scroller = $("scroller");
  const interimBox = $("interim"), interimText = $("interimText");
  const note = $("note"), mic = $("mic"), micLabel = $("micLabel");
  const statusEl = $("status"), statusText = $("statusText");
  const MODEL = "claude-haiku-4-5-20251001";

  const store = {
    get(k, d = "") { try { return localStorage.getItem("jako." + k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("jako." + k, v); } catch (e) {} }
  };
  const cfg = { engine: store.get("engine", "claude"), key: store.get("key"), ctx: store.get("ctx") };

  const say = (msg, warn) => { note.textContent = msg || ""; note.className = warn ? "warn" : ""; };
  const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
  const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

  // ---------- settings
  const dlg = $("settings");
  function syncFields() {
    const isClaude = $("engine").value === "claude";
    $("claudeFields").hidden = !isClaude;
    $("engineHint").textContent = isClaude
      ? "회의 맥락과 존댓말을 살린 자연스러운 번역. 사용한 만큼 API 요금이 나와요(짧은 문장 기준 매우 저렴)."
      : ("Translator" in self)
        ? "기기 안에서 번역해서 무료이고 빨라요. 처음 한 번 번역 모델을 내려받아요."
        : "이 브라우저는 내장 번역을 지원하지 않아요. PC용 Chrome 최신 버전에서 사용할 수 있어요.";
  }
  $("openSettings").onclick = () => {
    $("engine").value = cfg.engine; $("apiKey").value = cfg.key; $("ctx").value = cfg.ctx;
    syncFields(); dlg.showModal();
  };
  $("engine").onchange = syncFields;
  $("settingsForm").addEventListener("submit", ev => {
    if (ev.submitter && ev.submitter.value === "save") {
      cfg.engine = $("engine").value; cfg.key = $("apiKey").value.trim(); cfg.ctx = $("ctx").value;
      store.set("engine", cfg.engine); store.set("key", cfg.key); store.set("ctx", cfg.ctx);
      chromeTranslator = null;
      say("설정을 저장했어요.");
    }
  });
  if (cfg.engine === "claude" && !cfg.key) setTimeout(() => $("openSettings").click(), 400);

  // font size
  const sizes = ["1.25rem","1.45rem","1.75rem","2.1rem"];
  let sizeIdx = +store.get("size", "1") || 1;
  const applySize = () => document.documentElement.style.setProperty("--ko-size", sizes[sizeIdx]);
  applySize();
  $("size").onclick = () => { sizeIdx = (sizeIdx + 1) % sizes.length; applySize(); store.set("size", sizeIdx); };

  // ---------- translators
  const history = [];
  function buildPrompt(ja) {
    const recent = history.slice(-4).map(h => `JA: ${h.ja}\nKO: ${h.ko}`).join("\n\n");
    return [
      "You are a professional Japanese-to-Korean interpreter working live.",
      "Translate the NEW Japanese utterance into natural, fluent Korean suitable for a business setting.",
      "Output ONLY the Korean translation — no quotes, notes, or romanization.",
      "Match the speaker's politeness (polite Japanese → -습니다/-요 style).",
      "Input comes from speech recognition and may contain errors; infer the intended meaning from context.",
      "Render names in Korean with correct titles (様/さん → 님/씨, 部長 → 부장님).",
      cfg.ctx.trim() ? `\nSituation and terminology notes:\n${cfg.ctx.trim()}` : "",
      recent ? `\nPrevious lines (context only, do not re-translate):\n${recent}` : "",
      `\nNEW Japanese utterance:\n${ja}`
    ].join("\n");
  }

  async function translateClaude(ja, onText) {
    if (!cfg.key) throw new Error("NOKEY");
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": cfg.key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: MODEL, max_tokens: 1000, stream: true,
        messages: [{ role: "user", content: buildPrompt(ja) }] })
    });
    if (!res.ok) {
      let msg = ""; try { msg = (await res.json()).error?.message || ""; } catch (e) {}
      throw new Error(res.status === 401 ? "BADKEY" : res.status === 429 ? "RATE" : res.status === 529 ? "BUSY" : "HTTP " + res.status + " " + msg);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = "", out = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        try {
          const ev = JSON.parse(line.slice(5));
          if (ev.type === "content_block_delta" && ev.delta?.text) { out += ev.delta.text; onText(out); }
        } catch (e) {}
      }
    }
    return out.trim();
  }

  let chromeTranslator = null;
  async function translateChrome(ja) {
    if (!("Translator" in self)) throw new Error("NOCHROME");
    if (!chromeTranslator) {
      say("번역 모델을 준비하는 중이에요…");
      chromeTranslator = await Translator.create({
        sourceLanguage: "ja", targetLanguage: "ko",
        monitor(m) { m.addEventListener("downloadprogress", e => say(`번역 모델 내려받는 중 ${Math.round(e.loaded * 100)}%`)); }
      });
      say("");
    }
    return (await chromeTranslator.translate(ja)).trim();
  }

  const errCopy = m => ({
    NOKEY: "설정에서 Anthropic API 키를 입력해 주세요.",
    BADKEY: "API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.",
    RATE: "요청이 너무 많아요. 잠시 후 이어서 번역할게요.",
    BUSY: "번역 서버가 붐벼요. 잠시 후 다시 시도해 주세요.",
    NOCHROME: "이 브라우저는 내장 번역을 지원하지 않아요. 설정에서 Claude API로 바꿔 주세요."
  }[m] || "번역에 실패했어요. 인터넷 연결을 확인해 주세요.");

  // ---------- queue
  const queue = []; let busy = false;
  function addSegment(ja) {
    empty.hidden = true;
    const stick = nearBottom();
    const el = document.createElement("div"); el.className = "seg";
    const pJa = document.createElement("p"); pJa.className = "ja"; pJa.textContent = ja;
    const pKo = document.createElement("p"); pKo.className = "ko pending"; pKo.textContent = "번역 중…";
    el.append(pJa, pKo); log.appendChild(el);
    if (stick) toBottom();
    queue.push({ ja, el, pKo, pJa }); pump();
  }
  async function pump() {
    if (busy || !queue.length) return;
    busy = true;
    const batch = queue.splice(0, queue.length);
    const lead = batch[batch.length - 1];
    if (batch.length > 1) {
      lead.ja = batch.map(b => b.ja).join(" "); lead.pJa.textContent = lead.ja;
      batch.slice(0, -1).forEach(b => b.el.remove());
    }
    const stick = nearBottom();
    try {
      const ko = cfg.engine === "chrome"
        ? await translateChrome(lead.ja)
        : await translateClaude(lead.ja, t => { lead.pKo.className = "ko"; lead.pKo.textContent = t; if (stick) toBottom(); });
      lead.pKo.className = "ko"; lead.pKo.textContent = ko;
      history.push({ ja: lead.ja, ko });
      if (stick) toBottom();
    } catch (e) {
      lead.pKo.className = "ko err"; lead.pKo.textContent = errCopy(e.message);
      if (e.message === "NOKEY" || e.message === "BADKEY" || e.message === "NOCHROME") stopListening();
    } finally {
      busy = false;
      if (queue.length) setTimeout(pump, 300);
    }
  }

  // ---------- speech recognition
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function setListening(on) {
    listening = on;
    mic.classList.toggle("on", on); mic.setAttribute("aria-pressed", on);
    micLabel.textContent = on ? "마이크 끄기" : "마이크 켜기";
    statusEl.classList.toggle("on", on); statusText.textContent = on ? "듣는 중" : "대기 중";
    if (!on) { interimBox.hidden = true; interimText.textContent = ""; }
    if (on && "wakeLock" in navigator) navigator.wakeLock.request("screen").then(l => wake = l).catch(() => {});
    if (!on && wake) { wake.release().catch(() => {}); wake = null; }
  }
  let wake = null;
  function stopListening() { setListening(false); try { rec && rec.stop(); } catch (e) {} }

  if (!SR) {
    mic.disabled = true;
    say("이 브라우저는 음성 인식을 지원하지 않아요. Chrome·Edge·Safari에서 열어 주세요. 입력창 번역은 쓸 수 있어요.", true);
  } else {
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = ev => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i], t = r[0].transcript.trim();
        if (!t) continue;
        if (r.isFinal) addSegment(t); else interim += t;
      }
      const stick = nearBottom();
      interimText.textContent = interim; interimBox.hidden = !interim;
      if (stick) toBottom();
    };
    rec.onerror = ev => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") { say("마이크 권한이 막혀 있어요. 브라우저 설정에서 이 사이트의 마이크를 허용해 주세요.", true); setListening(false); }
      else if (ev.error === "audio-capture") { say("마이크를 찾을 수 없어요.", true); setListening(false); }
      else if (ev.error === "network") say("음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.", true);
    };
    rec.onend = () => { if (listening) setTimeout(() => { if (listening) try { rec.start(); } catch (e) {} }, 150); };
    mic.onclick = () => {
      if (listening) return stopListening();
      if (cfg.engine === "claude" && !cfg.key) { $("openSettings").click(); return; }
      say(""); setListening(true); try { rec.start(); } catch (e) {}
    };
  }

  $("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const v = $("txt").value.trim(); if (!v) return;
    addSegment(v); $("txt").value = "";
  });
  $("copy").onclick = async () => {
    const lines = [...log.querySelectorAll(".seg")].map(s => `${s.querySelector(".ja").textContent}\n${s.querySelector(".ko").textContent}`);
    if (!lines.length) return say("복사할 내용이 없어요.");
    try { await navigator.clipboard.writeText(lines.join("\n\n")); say("전체 내용을 복사했어요."); }
    catch (e) { say("복사하지 못했어요. 직접 선택해 복사해 주세요.", true); }
  };
  $("clear").onclick = () => { log.querySelectorAll(".seg").forEach(s => s.remove()); history.length = 0; empty.hidden = false; say(""); };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
